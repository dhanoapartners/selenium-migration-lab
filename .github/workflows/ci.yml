# Runs both suites against the live Practice Lab: the Selenium "before" and the Playwright "after".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '53 10 * * *' # daily, 10:53 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium:
    name: Selenium (Java, before)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: selenium-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
      - name: Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure-commandline@2.34.1 generate target/allure-results --clean -o target/allure-report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: selenium-reports
          path: |
            selenium-java/target/allure-report/
            selenium-java/target/surefire-reports/
          retention-days: 14

  playwright:
    name: Playwright (TypeScript, after)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - uses: actions/setup-java@v4 # the Allure CLI runs on Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'
      - name: Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure-commandline@2.34.1 generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-reports
          path: |
            playwright/allure-report/
            playwright/playwright-report/
          retention-days: 14
